<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ddd7ff">
  <title>INDIETOWN — Buyer Professional Plan</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="phone plan-phone" aria-label="Buyer 프로페셔널 플랜">
  <div class="rings" aria-hidden="true"></div>
  <header class="status" aria-hidden="true">
    <span>9:41</span>
    <svg width="78" height="17" viewBox="0 0 78 17" fill="currentColor"><rect x="0" y="9" width="3" height="6" rx="1"/><rect x="5" y="6" width="3" height="9" rx="1"/><rect x="10" y="3" width="3" height="12" rx="1"/><rect x="15" y="0" width="3" height="15" rx="1"/><path d="M26 4q8-7 16 0l-2 2q-6-5-12 0zm4 4q4-4 8 0l-2 2q-2-2-4 0zm2 4 2-2 2 2-2 3z"/><rect x="51" y="1" width="23" height="12" rx="3" fill="none" stroke="currentColor" stroke-opacity=".5"/><rect x="53" y="3" width="19" height="8" rx="1.5"/><path d="M76 5v4" stroke="currentColor" stroke-opacity=".5"/></svg>
  </header>
  <section class="plan-panel" aria-labelledby="plan-title">
    <h1 id="plan-title">Buyer</h1>
    <p class="plan-subtitle">바이어를 위한 프로페셔널 플랜</p>
    <div class="professional-plan">
      <svg class="plan-decoration" viewBox="0 0 455 692" aria-hidden="true"><circle cx="365" cy="578" r="118" fill="#d9c8ff" opacity=".5"/><path d="m277 462 149-28 7 43-125 23v125c0 70-110 86-117 23-5-40 41-65 87-52z" fill="#6745ff"/><path d="m382 486 26-5 29 148c13 67-100 94-113 36-9-38 34-66 74-57z" fill="#6040ff"/></svg>
      <h2>Professional Plan</h2>
      <ul class="plan-benefits">
        <li><span class="benefit-check" aria-hidden="true"></span><span>프로페셔널 플랜 전용<br>고급 아티스트 탐색, 매칭</span></li>
        <li><span class="benefit-check" aria-hidden="true"></span><span>차별화된 데이터 리포트</span></li>
        <li><span class="benefit-check" aria-hidden="true"></span><span>인디타운맵 추천 고도화</span></li>
      </ul>
      <div class="plan-price"><del>월 59,900</del><strong>월 39,900원</strong></div>
    </div>
    <button class="payment-button" type="button" id="payment">결제하기</button>
  </section>
  <dialog id="payment-notice" aria-labelledby="payment-notice-title"><h2 id="payment-notice-title">결제 안내</h2><p>결제 서비스는 아직 연결되지 않았습니다.</p><form method="dialog"><button>닫기</button></form></dialog>
  <div class="home-indicator" aria-hidden="true"></div>
</main>
<script>
 document.querySelector('#payment').addEventListener('click', () => document.querySelector('#payment-notice').showModal());
</script>
</body>
</html>
