    <circle cx="53" cy="311" r="3.5" fill="#fff"/>
  </svg><span>나</span></div>
    <button class="map-node artist-han" type="button" data-search="한로로" data-kind="artist"><span class="artist-avatar avatar-han" aria-hidden="true"><svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#fff"/><path d="m14 31 53-4 17 15-13 11 19 11-20 13-52-5 3-21-9-3z" stroke="#222" stroke-width="2" fill="none"/><text x="19" y="47" font-size="19" font-style="italic" font-family="Arial" font-weight="bold">HAN</text><text x="27" y="66" font-size="18" font-style="italic" font-family="Arial" font-weight="bold">RORO</text></svg></span><span class="artist-crown" aria-label="추천 아티스트">♛</span><span>한로로</span></button>
