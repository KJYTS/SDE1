<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ddd7ff">
  <title>INDIETOWN — Listener 취향 선택</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="phone preferences-phone" aria-label="Listener 취향 선택">
  <div class="rings" aria-hidden="true"></div>
  <header class="status" aria-hidden="true">
    <span>9:41</span>
    <svg width="78" height="17" viewBox="0 0 78 17" fill="currentColor"><rect x="0" y="9" width="3" height="6" rx="1"/><rect x="5" y="6" width="3" height="9" rx="1"/><rect x="10" y="3" width="3" height="12" rx="1"/><rect x="15" y="0" width="3" height="15" rx="1"/><path d="M26 4q8-7 16 0l-2 2q-6-5-12 0zm4 4q4-4 8 0l-2 2q-2-2-4 0zm2 4 2-2 2 2-2 3z"/><rect x="51" y="1" width="23" height="12" rx="3" fill="none" stroke="currentColor" stroke-opacity=".5"/><rect x="53" y="3" width="19" height="8" rx="1.5"/><path d="M76 5v4" stroke="currentColor" stroke-opacity=".5"/></svg>
  </header>
  <section class="preferences-panel" aria-labelledby="preferences-title">
    <h1 id="preferences-title">Listener</h1>
    <p class="preferences-question">어떤 음악을 좋아하세요?</p>
    <div class="keywords" role="group" aria-label="음악 취향 키워드, 여러 개 선택 가능">
      <div class="keyword-row"><button class="keyword" type="button" aria-pressed="false">감성적인</button><button class="keyword" type="button" aria-pressed="false">따뜻한</button><button class="keyword" type="button" aria-pressed="false">톤다운</button></div>
      <div class="keyword-row"><button class="keyword" type="button" aria-pressed="false">에너지</button><button class="keyword" type="button" aria-pressed="false">활기찬</button><button class="keyword" type="button" aria-pressed="false">위로되는</button></div>
      <div class="keyword-row"><button class="keyword" type="button" aria-pressed="false">잔잔한</button><button class="keyword" type="button" aria-pressed="false">모던한</button><button class="keyword" type="button" aria-pressed="false">미니멀한</button></div>
      <div class="keyword-row"><button class="keyword" type="button" aria-pressed="false">빈티지한</button><button class="keyword" type="button" aria-pressed="false">서정적인</button><button class="keyword" type="button" aria-pressed="false">아트팝</button></div>
      <div class="keyword-row"><button class="keyword" type="button" aria-pressed="false">아날로그</button><button class="keyword" type="button" aria-pressed="false">비정형</button><button class="keyword" type="button" aria-pressed="false">저자극</button></div>
      <div class="keyword-row"><button class="keyword" type="button" aria-pressed="false">몽환적인</button><button class="keyword" type="button" aria-pressed="false">스포티한</button></div>
    </div>
    <button class="preferences-next" type="button" disabled title="다음 화면은 아직 준비 중입니다">다음</button>
  </section>
  <div class="home-indicator" aria-hidden="true"></div>
</main>
<script src="preferences.js" defer></script>
</body>
</html>
