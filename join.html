<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ddd7ff">
  <title>INDIETOWN — 어떤 인디타우너인가요?</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="phone join-phone" aria-label="인디타운 역할 안내">
  <div class="rings" aria-hidden="true"></div>
  <header class="status" aria-hidden="true">
    <span>9:41</span>
    <svg width="78" height="17" viewBox="0 0 78 17" fill="currentColor"><rect x="0" y="9" width="3" height="6" rx="1"/><rect x="5" y="6" width="3" height="9" rx="1"/><rect x="10" y="3" width="3" height="12" rx="1"/><rect x="15" y="0" width="3" height="15" rx="1"/><path d="M26 4q8-7 16 0l-2 2q-6-5-12 0zm4 4q4-4 8 0l-2 2q-2-2-4 0zm2 4 2-2 2 2-2 3z"/><rect x="51" y="1" width="23" height="12" rx="3" fill="none" stroke="currentColor" stroke-opacity=".5"/><rect x="53" y="3" width="19" height="8" rx="1.5"/><path d="M76 5v4" stroke="currentColor" stroke-opacity=".5"/></svg>
  </header>
  <section class="join-panel" aria-labelledby="join-title">
    <h1 id="join-title">INDIETOWN</h1>
    <p class="join-question">당신은 어떤 인디타우너입니까?</p>
    <div class="role-list">
      <a class="role-card listener" href="listener.html">
        <div class="role-copy"><h2>Listener</h2><p class="role-label">리스너, 팬</p><p class="role-description">내 취향에 맞는<br>인디음악을 들어요</p></div>
        <svg class="role-art" viewBox="0 0 455 255" aria-hidden="true"><path d="M322 35 420 22l4 38-74 9 9 120c3 64-96 93-103 31-5-41 37-72 73-54z" fill="#149fa5" opacity=".55"/><path d="M363 87h33v61l43-43 23 24-43 43h61v33h-61l43 43-24 23-42-43v61h-33v-61l-43 43-23-23 43-43h-61v-33h61l-43-43 23-24 43 43z" fill="#d8ffff" opacity=".66"/></svg>
      </a>
      <article class="role-card artist">
        <div class="role-copy"><h2>Artist</h2><p class="role-label">아티스트</p><p class="role-description">나만의 음악 세계를<br>공유해요</p></div>
        <svg class="role-art" viewBox="0 0 455 255" aria-hidden="true"><path d="m401 73 22 68 63 26-61 27-25 71-25-70-64-26 65-27z" fill="#dce9ff" opacity=".7"/><path d="m316 36 116-10 3 43-88 9 15 127c7 70-106 99-116 35-7-42 43-67 79-51z" fill="#6040ff"/></svg>
      </article>
      <a class="role-card buyer" href="buyer.html">
        <div class="role-copy"><h2>Buyer</h2><p class="role-label">기획사, 브랜드, 행사관계자 등</p><p class="role-description">인디 아티스트들을<br>발굴해 새로운 가치를 창출해요</p></div>
        <svg class="role-art" viewBox="0 0 455 255" aria-hidden="true"><circle cx="400" cy="202" r="104" fill="#c3adff" opacity=".62"/><path d="M341 39h124v35h-95v143c0 63-112 81-118 17-3-40 45-69 89-52z" fill="#6543ff"/><ellipse cx="432" cy="220" rx="52" ry="57" fill="#6040ff"/></svg>
      </a>
    </div>
  </section>
  <div class="home-indicator" aria-hidden="true"></div>
</main>

</html>
